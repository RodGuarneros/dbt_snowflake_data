version: 2

sources: 
  - name: raw_bi_currency
    database: CROSS_CURRENCY
    schema: PUBLIC
    tables: 
      - name: TRANSACTIONS
        description: "Cross-currency operations by Wise (selected period)"
        columns:
          - name: TXN_ID
            description: "Transaction ID (PK)"
          - name: TXN_DATE
            description: "Transaction date"
            tests: 
              - not_null
          - name: STATUS
            description: "Status of the transaction"
          - name: SEND_CURRENCY 
            description: "The origin of the digital operation (ISO abbreviation)"
          - name: RECEIVED CURRENCY
            description: "The destination of the digital operation (ISO abbreviation)"
          - name: CUSTOMER_ID
            description: "ID of the responsible of the operation (FK)"
          - name: AMOUNT_GBP
            description: "Total amount of the operation in Grate Britain Pound"
