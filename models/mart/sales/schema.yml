
version: 2

models:

  # ==========================================
  # DIMENSIÓN: MARCAS DE VEHÍCULOS
  # ==========================================

  - name: dim_carmake
    description: >
      Dimensión de marcas de vehículos.
      Contiene una clave subrogada única
      para cada marca.

    columns:

      - name: ID_CARMAKE
        description: "Clave subrogada única para cada marca."
        data_tests:
          - unique
          - not_null

      - name: CARMAKE
        description: "Nombre de la marca del vehículo."
        data_tests:
          - not_null


  # ==========================================
  # DIMENSIÓN: VENDEDORES
  # ==========================================

  - name: dim_salesperson
    description: >
      Dimensión de vendedores.
      Contiene una clave subrogada única
      para cada vendedor.

    columns:

      - name: ID_SALESPERSON
        description: "Clave subrogada única del vendedor."
        data_tests:
          - unique
          - not_null

      - name: SALEPERSON
        description: "Nombre del vendedor."
        data_tests:
          - not_null


  # ==========================================
  # TABLA DE HECHOS: VENTAS MENSUALES
  # ==========================================

  - name: fct_monthly_sales
    description: >
      Tabla de hechos que consolida las ventas
      mensuales por vendedor y marca de vehículo.
      Incluye ventas totales y comisiones.

    columns:

      - name: DDATE
        description: "Primer día del mes de la venta."
        data_tests:
          - not_null

      # CLAVE FORÁNEA: VENDEDOR

      - name: ID_SALESPERSON
        description: "Clave foránea a la dimensión de vendedores."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: ID_SALESPERSON

      # CLAVE FORÁNEA: MARCA

      - name: ID_CARMAKE
        description: "Clave foránea a la dimensión de marcas."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_carmake')
                field: ID_CARMAKE

      # MÉTRICAS FINANCIERAS

      - name: TOTAL_SALES
        description: >
          Monto total de ventas netas por mes,
          vendedor y marca.

      - name: TOTAL_COMMISSIONS
        description: >
          Monto total de comisiones generadas
          por mes, vendedor y marca.
